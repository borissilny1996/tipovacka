services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tipovacka
      POSTGRES_USER: tipovacka
      POSTGRES_PASSWORD: tipovacka
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tipovacka"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
