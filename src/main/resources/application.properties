# ── Default / dev ─────────────────────────────────────────────────────────────
# Running with `mvn quarkus:dev` uses these — no profile flag needed.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/tipovacka
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.log.level=INFO

# ── Production overrides (`mvn quarkus:build` or `-Dquarkus.profile=prod`) ────
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:tipovacka}
%prod.quarkus.datasource.password=${DB_PASSWORD:tipovacka}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/tipovacka}

%prod.quarkus.hibernate-orm.database.generation=validate
%prod.quarkus.hibernate-orm.sql-load-script=no-file
%prod.quarkus.log.level=WARN

# ── Scoring rules ─────────────────────────────────────────────────────────────
tipovacka.scoring.exact-score=2
tipovacka.scoring.correct-outcome=1
tipovacka.scoring.tournament-winner=2
